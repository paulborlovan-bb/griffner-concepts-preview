<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journey · Gehen</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="jr.css">
<link rel="stylesheet" href="basis.css">
<link rel="stylesheet" href="einstieg.css">
<link rel="stylesheet" href="gehen-szene.css">
<link rel="stylesheet" href="stapel.css">
<link rel="stylesheet" href="leben.css">
</head>
<body>
<!-- Die Seite /journey (Runde 10, 2026-11-23, neuer Text): Einstieg (wie Über uns), die 14 Tage mit dem Paar (gehen-szene.js),
     der Stapel, Ab Tag 15 mit vier Kapiteln und der Abschluss. Texte in inhalt.js. Dieselben Teile laufen als Framer Komponenten
     JourneyEinstieg, JourneyGehen, JourneyStapel und JourneyLeben (framer-bau.mjs). Die Fassung bis Runde 9: gehen-3.html. -->
<main>
<div class="jg" data-je></div>
<div class="jg" data-jg></div>
<div class="jg" data-js></div>
<div class="jg" data-jl></div>
</main>
<script type="module">
import { chrome, reduce } from './jr.js';
import * as Einstieg from './einstieg.js';
import * as Szene from './gehen-szene.js';
import * as Stapel from './stapel.js';
import * as Leben from './leben.js';
import { makeHaus } from './haus3d.js';
import { figure } from './figur3d.js';
import { loadEchteFamilie, prefetchEchteFamilie, familieUrl } from './familie-echt.js';
chrome(1);
const el = s => document.querySelector(s);
/* ?big / ?small erzwingt eine Datei des Paars, ?nogl testet die ruhige Fassung ohne 3D */
const q = new URLSearchParams(location.search), FAM = q.has('big') ? './familie-echt.bin.gz' : q.has('small') ? './familie-echt-s.bin.gz' : familieUrl('./familie-echt.bin.gz', './familie-echt-s.bin.gz');
const three = q.has('nogl') ? () => Promise.reject(new Error('Test: ohne WebGL')) : () => import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
el('[data-je]').innerHTML = Einstieg.markup(Einstieg.DEF);
el('[data-jg]').innerHTML = Szene.markup(Szene.DEF);
el('[data-js]').innerHTML = Stapel.markup(Stapel.DEF);
el('[data-jl]').innerHTML = Leben.markup(Leben.DEF);
window.__je = Einstieg.mount(el('[data-je]'), Einstieg.DEF, { reduce });
window.__jgh = Szene.mount(el('[data-jg]'), Szene.DEF, { three, makeHaus, figure, prefetch: () => prefetchEchteFamilie(FAM), family: T => loadEchteFamilie(T, FAM), reduce, scrollTo: y => window.__lenis ? window.__lenis.scrollTo(y, { duration: Math.min(2.4, 1.1 + Math.abs(y - scrollY) / innerHeight * .18), easing: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2 }) : scrollTo({ top: y, behavior: 'smooth' }) });
window.__js = Stapel.mount(el('[data-js]'), Stapel.DEF, { reduce });
window.__jl = Leben.mount(el('[data-jl]'), Leben.DEF, { reduce });
/* Runde 13: frei scrollen, weich wie auf der Website (Lenis 1.1.13 wie SmoothScroll.tsx, auf /journey mit 1,6 s statt 1,25 s); ?nativ schaltet es ab */
if (!reduce && !q.has('nativ')) {
  import('https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.mjs').then(({ default: Lenis }) => {
    const L = window.__lenis = new Lenis({ duration: 1.6, easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)), smoothWheel: true });
    const loop = t => { L.raf(t); requestAnimationFrame(loop); }; requestAnimationFrame(loop);
    const io = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    window.__jl.go = y => L.scrollTo(y, { duration: Math.min(2.4, 1.1 + Math.abs(y - scrollY) / innerHeight * .18), easing: io });
  }).catch(e => console.warn('[Journey] Lenis', e));
}
</script>
</body>
</html>
