<!-- Vorschlag 1, Gehen: du gehst in 3D auf dein Haus zu. Szene, Texte und Zeitplan in gehen-szene.js (dieselbe Szene läuft als Framer Komponente JourneyGehen). -->
<main><div class="jg" data-jg></div></main>
<script type="module">
import { chrome, reduce } from './jr.js';
import { DEF, markup, mount } from './gehen-szene.js';
import { makeHaus } from './haus3d.js';
import { figure } from './figur3d.js';
import { humanFamily } from './familie-mensch.js';
chrome(1);
const root = document.querySelector('[data-jg]');
root.innerHTML = markup(DEF);
mount(root, DEF, { three: () => import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'), makeHaus, figure, family: T => Promise.resolve(humanFamily(T)), reduce });
</script>
</body>
