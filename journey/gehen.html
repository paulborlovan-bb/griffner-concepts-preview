<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journey · Vorschlag 1 · Gehen</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="jr.css">
<style>
/* Vorschlag 1, Gehen: du gehst in 3D auf dein Haus zu. Die Figur ist die aus dem Concepts Hero. */
.g{position:relative}
.g__stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#000}
.g__gl{position:absolute;inset:0}
.g__gl canvas{display:block;width:100%;height:100%}
.g__stage::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 58%,rgba(0,0,0,.6) 100%);z-index:1}
.g__tags{position:absolute;inset:0;pointer-events:none;z-index:2}
.g__tag{position:absolute;left:0;top:0;display:flex;align-items:baseline;gap:10px;white-space:nowrap;opacity:0;will-change:transform,opacity;transform-origin:left bottom}
.g__tag b{font-weight:500}
.g__tag span{font-family:var(--font-display);font-weight:300;font-size:1.0625rem;letter-spacing:.02em;text-transform:uppercase;opacity:0;transition:opacity 500ms var(--ease)}
.g__tag.is-on span{opacity:1}
.g__intro{position:absolute;inset:0;z-index:3;pointer-events:none}
.g__intro .ji{min-height:100%;height:100%}
.g__steps{list-style:none;margin:0;padding:0;position:absolute;left:var(--page-margin);bottom:clamp(40px,9vh,96px);width:min(36rem,calc(100% - 2 * var(--page-margin)));z-index:3;pointer-events:none}
.g__s{position:absolute;left:0;bottom:0;width:100%;display:grid;gap:16px;opacity:0;transform:translateY(24px);transition:opacity 600ms var(--ease),transform 900ms var(--ease)}
.g__s.is-on{opacity:1;transform:none;transition-delay:120ms}
.g__m{display:flex;gap:14px;opacity:.75}
.g__m em{font-style:normal;color:var(--gelb)}
.g__rail{position:absolute;right:var(--page-margin);top:50%;transform:translateY(-50%);display:grid;gap:9px;z-index:3}
.g__rail i{display:block;width:14px;height:1px;background:rgba(255,255,255,.35);transition:background-color 400ms var(--ease),width 400ms var(--ease),height 400ms var(--ease)}
.g__rail i.is-past{background:#fff}
.g__rail i.is-now{width:15px;height:12px;background:var(--gelb)}
.g__end{position:absolute;inset:auto 0 0 0;z-index:4;opacity:0;pointer-events:none;transition:opacity 700ms var(--ease)}
.g__end.is-on{opacity:1;pointer-events:auto}
.g__end .jo{padding-top:0;padding-bottom:clamp(40px,9vh,96px)}
.g__end .jo__h{font-size:var(--t-l)}
.g__end .jo__lead{font-size:1.5rem}
.g__note{position:absolute;left:var(--page-margin);bottom:18px;z-index:3;opacity:.45}
@media (max-width:809px){
  .g__steps{bottom:calc(28px + env(safe-area-inset-bottom))}
  .g__s .h-xl{font-size:var(--t-l)}
  .g__rail{top:auto;bottom:calc(14px + env(safe-area-inset-bottom));right:auto;left:var(--page-margin);transform:none;display:flex;gap:5px;align-items:center}
  .g__steps{bottom:calc(48px + env(safe-area-inset-bottom))}
  .g__rail i{width:12px}
  .g__rail i.is-now{width:15px;height:12px}
  .g__tag span{display:none}
}
/* Reduzierte Bewegung: ein ruhiges Bild vom Ende, darunter alle Schritte */
.is-static .g__stage{position:relative;height:72vh}
.is-static .g__steps,.is-static .g__rail,.is-static .g__tags,.is-static .g__end,.is-static .g__intro{display:none}
.g__list{display:none}
.is-static .g__list,.is-static .g__intro-static,.is-static .g__outro-static{display:block}
.g__intro-static,.g__outro-static{display:none}
.is-static .g__intro-static .ji{min-height:auto;padding-top:160px}
</style>
</head>
<body>
<main>
  <div class="g__intro-static" data-intro-static></div>
  <section class="g" id="g" aria-label="Deine Journey in 14 Schritten">
    <div class="g__stage">
      <div class="g__gl" data-gl aria-hidden="true"></div>
      <div class="g__tags" data-tags aria-hidden="true"></div>
      <div class="g__intro" data-intro></div>
      <ol class="g__steps" data-steps></ol>
      <div class="g__rail" data-rail aria-hidden="true"></div>
      <div class="g__end" data-end></div>
    </div>
  </section>
  <div class="g__list" data-list></div>
  <div class="g__outro-static" data-outro-static></div>
</main>
<script type="module">
import { STEPS, chrome, introHTML, outroHTML, listHTML, reduce, clamp, lerp, E, prog, ticker } from './jr.js';
chrome(1);
const $ = (s, r = document) => r.querySelector(s);
const el = $('#g'), N = STEPS.length;
$('[data-intro]').innerHTML = introHTML();
$('[data-end]').innerHTML = outroHTML();
$('[data-steps]').innerHTML = STEPS.map((s, i) => `<li class="g__s" data-s="${i}"><p class="info g__m"><span><em>${s.nr}</em> / ${N}</span><span>${s.m}</span></p><h2 class="h-xl">${s.t}</h2><p class="txt">${s.d}</p></li>`).join('');
$('[data-rail]').innerHTML = STEPS.map(() => '<i></i>').join('');
$('[data-tags]').innerHTML = STEPS.map(s => `<div class="g__tag info"><b>${s.nr}</b><span>${s.t}</span></div>`).join('');
const LIS = [...el.querySelectorAll('.g__s')], RAIL = [...el.querySelectorAll('.g__rail i')], TAGS = [...el.querySelectorAll('.g__tag')];
const INTRO = $('[data-intro]'), END = $('[data-end]');
if (reduce) {
  document.documentElement.classList.add('is-static');
  $('[data-intro-static]').innerHTML = introHTML();
  $('[data-list]').innerHTML = listHTML();
  $('[data-outro-static]').innerHTML = outroHTML();
}

/* Zeitplan in Einheiten: Anlauf, dann je Station gehen (WALK) und stehen bleiben, zuletzt zur Tür und hinein */
const L0 = .7, WALK = .55, U = L0 + 15.9, VH_PER_U = 62;
if (!reduce) el.style.height = `calc(${(U * VH_PER_U).toFixed(1)}vh + 100vh)`;
const arr = i => L0 + i + WALK;

const H3 = await import('./haus3d.js');
const { figure } = await import('./figur3d.js');
const T = H3.T;
const S = H3.createStage($('[data-gl]'), { bg: 0x000000, fov: 32, shadow: .55, key: 2.2, hemi: .6, fogNear: 55, fogFar: 190 });
const sc = S.scene;
const grid = new T.GridHelper(600, 150, 0x1c1c1c, 0x121212); grid.position.y = .002; sc.add(grid);

/* Der Weg: Start, 14 Stationen, Anlauf zur Tür, durch die Tür */
const SP = 7, HX = 0, HZ = -(14 * SP) - 21, DX = HX + 7.3;
const pts = [new T.Vector3(0, 0, 0)];
STEPS.forEach((_, i) => pts.push(new T.Vector3(2.6 * Math.sin((i + 1) * .75), 0, -(i + 1) * SP)));
pts.push(new T.Vector3(HX + 4.6, 0, HZ + 10), new T.Vector3(DX, 0, HZ + 5.4), new T.Vector3(DX, 0, HZ + 3.9));
const curve = new T.CatmullRomCurve3(pts, false, 'centripetal');
const NS = 3000, SMP = curve.getSpacedPoints(NS), LEN = curve.getLength();
const near = p => { let b = 0, bd = 1e9; SMP.forEach((q, j) => { const d = q.distanceToSquared(p); if (d < bd) { bd = d; b = j; } }); return b / NS * LEN; };
const ST = STEPS.map((_, i) => near(pts[i + 1]));
const SEND = LEN;
const at = s => { const f = clamp(s / LEN) * NS, j = Math.min(NS - 1, Math.floor(f)), k = f - j, a = SMP[j], b = SMP[j + 1]; return { x: lerp(a.x, b.x, k), z: lerp(a.z, b.z, k), tx: b.x - a.x, tz: b.z - a.z }; };
const tan = s => { const a = at(Math.max(0, s - .6)), b = at(Math.min(LEN, s + .6)); const dx = b.x - a.x, dz = b.z - a.z, l = Math.hypot(dx, dz) || 1; return [dx / l, dz / l]; };

/* Linien auf dem Boden: vorne gepunktet, hinter dir durchgezogen */
const lp = SMP.filter((_, j) => j % 3 === 0).map(p => new T.Vector3(p.x, .012, p.z));
const ahead = new T.Line(new T.BufferGeometry().setFromPoints(lp), new T.LineDashedMaterial({ color: 0xCACACA, dashSize: .22, gapSize: .45, transparent: true, opacity: .55 }));
ahead.computeLineDistances(); sc.add(ahead);
const done = new T.Line(new T.BufferGeometry().setFromPoints(lp.map(p => p.clone().setY(.016))), new T.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: .9 }));
sc.add(done);

/* Stationen: ein gelbes Feld (5:4) neben dem Weg und ein dünner Pflock. Leer als Umriss, erreicht gefüllt. */
const yel = new T.MeshBasicMaterial({ color: 0xFFB200, transparent: true });
const PL = ST.map((s, i) => {
  const p = at(s), [dx, dz] = tan(s), rx = -dz, rz = dx, x = p.x + rx * 1.45, z = p.z + rz * 1.45;
  const g = new T.Group(); g.position.set(x, 0, z); g.rotation.y = Math.atan2(-dx, -dz); sc.add(g);
  const fill = new T.Mesh(new T.BoxGeometry(1, .03, .8), yel.clone()); fill.position.y = .02; fill.material.opacity = 0; g.add(fill);
  const edge = new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(1, .03, .8)), new T.LineBasicMaterial({ color: 0xCACACA, transparent: true, opacity: .7 })); edge.position.y = .02; g.add(edge);
  const post = new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(.5, 0, 0), new T.Vector3(.5, 1.5, 0)]), new T.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: .5 })); g.add(post);
  return { g, fill, edge, post, x, z, tip: new T.Vector3(.5, 1.5, 0) };
});

/* Das Haus am Ende des Wegs: Concept Wald. Erst als Plan in Linien, dann Schnurgerüst, Bodenplatte, Haus, Licht. */
const C = H3.CONCEPTS.wald;
const ghost = S.house({ line: 0xCACACA }); ghost.set({ ...C }); ghost.x = HX; ghost.z = HZ; ghost.ghost = 1; ghost.build = 0;
const house = S.house({ line: 0x8a8a8a, toned: true }); house.set({ ...C }); house.x = HX; house.z = HZ; house.build = 0; house.edgeAlways = .28;
const stake = S.stake(); stake.set({ L0: C.L0, D: C.D }); stake.x = HX; stake.z = HZ; stake.build = 0;
const slab = new T.Mesh(new T.BoxGeometry(C.L0 + 1.2, .32, C.D + 1.2), new T.MeshStandardMaterial({ color: 0x3a3a38, roughness: .95 }));
slab.receiveShadow = true; slab.castShadow = true; slab.position.set(HX, .16, HZ); sc.add(slab);
const door = new T.Mesh(new T.PlaneGeometry(1.05, 2.4), new T.MeshBasicMaterial({ color: 0xFFD9AC, transparent: true, opacity: 0 }));
door.position.set(DX, 1.2, HZ + C.D / 2 + .12); sc.add(door);
const spill = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d'), gr = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,217,172,.7)'); gr.addColorStop(1, 'rgba(255,217,172,0)'); x.fillStyle = gr; x.fillRect(0, 0, 128, 128);
  const m = new T.Mesh(new T.PlaneGeometry(4, 5), new T.MeshBasicMaterial({ map: new T.CanvasTexture(c), transparent: true, opacity: 0, depthWrite: false, blending: T.AdditiveBlending }));
  m.rotation.x = -Math.PI / 2; m.position.set(DX, .02, HZ + C.D / 2 + 2.2); sc.add(m); return m;
})();
const lamp = new T.PointLight(0xFFD2A0, 0, 16, 1.4); lamp.position.set(DX, 1.8, HZ + C.D / 2 + 1.4); sc.add(lamp);

/* Du */
const F = figure(T); sc.add(F.man);

/* Gehen über den Weg: Position s in m aus den Einheiten u */
const sm = x => x * x * (3 - 2 * x);
function sAt(u) {
  if (u < L0) return 0;
  const b = Math.floor(u - L0), f = u - L0 - b;
  if (b >= N) { const k = clamp((u - L0 - N) / .75); return lerp(ST[N - 1], SEND, sm(k)); }
  const s0 = b ? ST[b - 1] : 0;
  return f < WALK ? lerp(s0, ST[b], sm(f / WALK)) : ST[b];
}

let vk = '', sp = null, lt = 0, sPrev = 0, ph = 0, env = 0, yaw = 0, dir = 1, idle = 0, look = 0, active = -2, cam = null;
const tmp = new T.Vector3(), lookV = new T.Vector3();
const angTo = (a, b, k) => { let d = ((b - a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI; return a + d * k; };

function frame(u, dt, now, still) {
  const s = sAt(u), ds = s - sPrev; sPrev = s;
  const speed = Math.abs(ds) / Math.max(dt, 1e-3);
  env += (clamp(speed / 1.1) - env) * (still ? 1 : 1 - Math.exp(-dt * 7));
  ph += Math.abs(ds) / 1.5 * Math.PI * 2;
  if (ds > 1e-4) { dir = 1; idle = 0; } else if (ds < -1e-4) { dir = -1; idle = 0; } else idle += dt;
  if (idle > .8) dir = 1;
  const p = at(s), [dx, dz] = tan(s);
  const yt = Math.atan2(-dx, -dz) + (dir < 0 ? Math.PI : 0);
  yaw = still ? yt : angTo(yaw, yt, 1 - Math.exp(-dt * 6));
  F.man.position.set(p.x, 0, p.z); F.man.rotation.y = yaw;
  /* An der Station schaut die Figur zum gelben Feld rechts */
  let nd = 1e9; ST.forEach(q => { nd = Math.min(nd, Math.abs(q - s)); });
  const lt2 = dir > 0 ? -.55 * (1 - clamp(nd / 1.8)) * (1 - env) : 0;
  look += (lt2 - look) * (still ? 1 : 1 - Math.exp(-dt * 4));
  F.pose(ph, env, now / 1000, look, still);
  F.fade(1 - E(s, SEND - 1.1, SEND - .2));

  /* Kamera: schräg hinter dir, Blick den Weg entlang. Am Ende weit zurück, das ganze Haus. */
  const vw = innerWidth, vh = innerHeight, narrow = vw / vh < .85;
  const ox = narrow ? -1.5 : -2.5, oy = narrow ? 3.7 : 2.7, oz = narrow ? 11 : 7.4, ahead2 = narrow ? 5 : 6.5;
  const rx = -dz, rz = dx;
  const c1 = [p.x + rx * ox - dx * oz, oy, p.z + rz * ox - dz * oz], l1 = [p.x + dx * ahead2 + rx * .7, narrow ? 1.25 : 1.05, p.z + dz * ahead2 + rz * .7];
  const wide = narrow ? [HX - 8, 14, HZ + 74] : [HX - 19, 7, HZ + 40], wl = narrow ? [HX - 1.5, -4, HZ] : [HX - 3.5, 2.7, HZ + 2];
  const kw = E(u, L0 + N + .05, L0 + N + .85);
  const tc = c1.map((v, i) => lerp(v, wide[i], kw)), tl = l1.map((v, i) => lerp(v, wl[i], kw));
  if (!cam || still) cam = { c: tc, l: tl };
  else { const k = 1 - Math.exp(-dt * 5); cam.c = cam.c.map((v, i) => lerp(v, tc[i], k)); cam.l = cam.l.map((v, i) => lerp(v, tl[i], k)); }
  S.cam.position.set(...cam.c); lookV.set(...cam.l); S.cam.lookAt(lookV);
  /* Breit: das Bild rückt nach rechts, links bleibt Platz für den Text */
  const cw = S.r.domElement.clientWidth, ch = S.r.domElement.clientHeight, vo = narrow ? 0 : -cw * .17, key = cw + ',' + ch + ',' + vo;
  if (key !== vk) { vk = key; S.cam.setViewOffset(cw, ch, vo, 0, cw, ch); S.cam.updateProjectionMatrix(); }
  S.key.position.set(p.x - 34, 60, p.z + 46); S.key.target.position.set(p.x, 0, p.z - 20); S.key.target.updateMatrixWorld();

  /* Weg und Stationen */
  done.geometry.setDrawRange(0, Math.round(clamp(s / LEN) * lp.length));
  PL.forEach((q, i) => {
    const r = E(s, ST[i] - 1.2, ST[i] - .1);
    q.fill.material.opacity = r; q.edge.material.opacity = lerp(.7, 0, r);
    q.g.scale.setScalar(1 + .25 * Math.sin(Math.PI * clamp((s - ST[i] + 1.2) / 1.4)) * (1 - E(nd, .5, 2)) * (i === nearest(s) ? 1 : 0));
  });

  /* Das Haus entsteht mit den Schritten */
  const kPlan = E(u, arr(4) - .15, arr(4) + .35);
  ghost.build = kPlan; ghost.g.visible = kPlan > .002;
  ghost.lineMat.opacity = kPlan * (1 - E(u, arr(10) + .1, arr(10) + .45));
  stake.build = E(u, arr(8) - .1, arr(8) + .4) * (1 - E(u, arr(10) - .2, arr(10) + .05)); stake.g.visible = stake.build > .002;
  const kSlab = E(u, arr(9) - .15, arr(9) + .25); slab.scale.set(1, Math.max(.001, kSlab), 1); slab.position.y = .16 * kSlab; slab.visible = kSlab > .002;
  house.build = E(u, arr(10) - .3, arr(10) + .4); house.g.visible = house.build > .002;
  house.night = .25 * E(u, arr(11) - .2, arr(11) + .2) + .5 * E(u, arr(12) - .2, arr(12) + .2);
  const kIn = E(u, arr(13) - .25, arr(13) + .1);
  door.material.opacity = kIn; spill.material.opacity = kIn * .9; lamp.intensity = kIn * 18;
  const dusk = Math.max(.45 * E(u, arr(11) - .2, arr(12) + .2), E(u, arr(13) - .2, L0 + N + .8));
  S.hemi.intensity = lerp(.6, .16, dusk); S.key.intensity = lerp(2.2, .45, dusk); S.fill.intensity = lerp(.5, .15, dusk);
  S.render();

  /* Nummern an den Pflöcken */
  const W = S.r.domElement.clientWidth;
  PL.forEach((q, i) => {
    tmp.copy(q.tip).applyMatrix4(q.g.matrixWorld);
    const d = S.cam.position.distanceTo(tmp), pr2 = S.project(tmp.x, tmp.y, tmp.z), t = TAGS[i];
    const o = pr2.z < 1 && pr2.x > -40 && pr2.x < W + 40 ? clamp((46 - d) / 14) * (1 - kw * .6) : 0;
    t.style.opacity = o.toFixed(3);
    if (o > 0) t.style.transform = `translate3d(${(pr2.x + 8).toFixed(1)}px,${(pr2.y - 14).toFixed(1)}px,0) scale(${clamp(9 / d, .6, 1.15).toFixed(3)})`;
    t.classList.toggle('is-on', i === active);
  });

  /* Text der Station: sobald du da bist, bis du weitergehst */
  let a = -1; for (let i = 0; i < N; i++) { const f = u - (L0 + i); if (f >= WALK * .78 && f < 1 + WALK * .2) a = i; }
  if (a !== active) {
    active = a;
    LIS.forEach((li, i) => li.classList.toggle('is-on', i === a));
    RAIL.forEach((r, i) => { r.classList.toggle('is-now', i === a); r.classList.toggle('is-past', i < a || (a < 0 && u > L0 + N)); });
  }
  INTRO.style.opacity = (1 - E(u, .12, .5)).toFixed(3);
  END.classList.toggle('is-on', u > L0 + N + .7);
}
function nearest(s) { let b = 0, bd = 1e9; ST.forEach((q, i) => { const d = Math.abs(q - s); if (d < bd) { bd = d; b = i; } }); return b; }

if (reduce) {
  /* Ruhiges Bild: du stehst vor deinem fertigen Haus, die Tür ist offen */
  const draw = () => { sPrev = ST[N - 1]; frame(U, .016, 0, true); F.fade(1); F.man.position.set(DX - .4, 0, HZ + 8); F.man.rotation.y = .15; F.pose(0, 0, 0, 0, true); S.render(); };
  S.onResize = draw; draw();
} else {
  const tk = ticker(now => {
    const pr = prog(el); if (!pr.on) { sp = null; return false; }
    const dt = Math.min(.1, (now - lt) / 1000 || .016); lt = now;
    if (sp === null || Math.abs(pr.p - sp) > .25) sp = pr.p; else sp += (pr.p - sp) * (1 - Math.exp(-dt * 5));
    frame(sp * U, dt, now, false);
    return true;
  });
  addEventListener('scroll', () => tk.poke(), { passive: true });
  S.onResize = () => tk.poke();
  tk.poke();
}
</script>
</body>
</html>
