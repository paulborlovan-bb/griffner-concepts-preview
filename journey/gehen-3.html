<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Journey · Vorschlag 1 · Gehen · Variante 3</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="jr.css">
<link rel="stylesheet" href="gehen-szene.css">
</head>
<body>
<!-- Variante 3 (wie /journey-3): das Paar Hand in Hand, echte Menschen, Microsoft Rocketbox (MIT, familie-echt.js), Runde 8, Runde 9 schnell am Telefon. Vorschlag 1, Gehen: du gehst in 3D auf dein Haus zu. Szene, Texte und Zeitplan in gehen-szene.js (dieselbe Szene läuft als Framer Komponente JourneyGehen). -->
<main><div class="jg" data-jg></div></main>
<script type="module">
import { chrome, reduce } from './jr.js';
import { DEF, markup, mount } from './gehen-szene.js';
import { makeHaus } from './haus3d.js';
import { figure } from './figur3d.js';
import { loadEchteFamilie, prefetchEchteFamilie, familieUrl } from './familie-echt.js';
chrome(1);
const root = document.querySelector('[data-jg]');
root.innerHTML = markup(DEF);
/* Runde 9: Telefon lädt die kleine Datei, der Download startet sofort (parallel zu three.js). ?big / ?small erzwingt eine Datei, ?nogl testet die ruhige Fassung ohne 3D. */
const q = new URLSearchParams(location.search), FAM = q.has('big') ? './familie-echt.bin.gz' : q.has('small') ? './familie-echt-s.bin.gz' : familieUrl('./familie-echt.bin.gz', './familie-echt-s.bin.gz');
const three = q.has('nogl') ? () => Promise.reject(new Error('Test: ohne WebGL')) : () => import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
window.__jgh = mount(root, DEF, { three, makeHaus, figure, prefetch: () => prefetchEchteFamilie(FAM), family: T => loadEchteFamilie(T, FAM), reduce });
</script>
</body>
</html>
